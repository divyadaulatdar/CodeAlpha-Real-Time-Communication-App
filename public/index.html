ji<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Communication App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Real-Time Communication</h1>
    <p class="subtitle">CodeAlpha Task 4</p><section class="panel">
  <label for="room">Meeting Room ID</label>
  <input id="room" type="text" placeholder="Enter room name">
  <button id="joinBtn">Join Room</button>
  <p id="status">Not connected to a room</p>
</section> 
<section class="video-grid">
  <div>
    <h2>Your Camera</h2>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>
  <div>
    <h2>Remote Participant</h2>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
</section>

<section class="controls">
  <button id="cameraBtn">Start Camera</button>
  <button id="shareBtn">Share Screen</button>
</section>

<section class="panel">
  <h2>Room Chat</h2>
  <div id="messages" class="messages"></div>
  <div class="chat-row">
    <input id="messageInput" type="text" placeholder="Write a message">
    <button id="sendBtn">Send</button>
  </div>
</section>

<p class="note">Use a unique room name to meet other participants.</p>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

  </body>
</html>
