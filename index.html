<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Task 4 - Real-Time Communication App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Real-Time Communication</h1>
    <p class="subtitle">CodeAlpha Task 4</p>

    <section class="panel">
      <h2>Meeting Room</h2>
      <label for="username">Your Name</label>
      <input id="username" type="text" placeholder="Enter your name">
      <label for="room">Meeting Room ID</label>
      <input id="room" type="text" placeholder="Enter room ID">
      <button id="joinBtn">Join Room</button>
      <p id="status">Not connected to a room</p>
      <p id="participants">Participants: 0</p>
    </section>

    <section class="video-grid">
      <div class="panel">
        <h2>Your Camera</h2>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="panel">
        <h2>Remote Participant</h2>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </section>

    <section class="controls">
      <button id="cameraBtn">Start Camera</button>
      <button id="micBtn">Mute Microphone</button>
      <button id="shareBtn">Share Screen</button>
      <button id="leaveBtn">Leave Room</button>
    </section>

    <section class="panel">
      <h2>Room Chat</h2>
      <div id="messages" class="messages"></div>
      <div class="chat-row">
        <input id="messageInput" type="text" placeholder="Type a message">
        <button id="sendBtn">Send</button>
      </div>
    </section>

    <section class="panel">
      <h2>File Sharing</h2>
      <input id="fileInput" type="file">
      <button id="uploadBtn">Share File</button>
      <div id="fileList"></div>
    </section>

    <section class="panel">
      <h2>Collaborative Whiteboard</h2>
      <canvas id="whiteboard" width="700" height="350"></canvas>
      <button id="clearBoardBtn">Clear Whiteboard</button>
    </section>

    <section class="panel">
      <h2>Account</h2>
      <input id="authUsername" type="text" placeholder="Username">
      <input id="authPassword" type="password" placeholder="Password">
      <button id="registerBtn">Register</button>
      <button id="loginBtn">Login</button>
      <p id="authStatus"></p>
    </section>

    <p class="note">
      Use the same room ID to meet another participant.
    </p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
